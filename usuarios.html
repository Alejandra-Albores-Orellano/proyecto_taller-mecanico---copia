<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content">
        <h2>Gestión de Usuarios</h2>
        <div class="card">
            <h3>Nuevo Usuario</h3>
            <form id="formUsr">
                <div class="form-row">
                    <div class="form-group"><input type="text" id="name" placeholder="Nombre" required></div>
                    <div class="form-group"><input type="text" id="user" placeholder="Login" required></div>
                    <div class="form-group"><input type="password" id="pass" placeholder="Password" required></div>
                    <div class="form-group">
                        <select id="rol">
                            <option value="mecanico">Mecánico</option>
                            <option value="recepcion">Recepción</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                </div>
                <button class="btn btn-primary">Crear</button>
            </form>
        </div>
        <div class="card">
            <table>
                <thead><tr><th>Nombre</th><th>User</th><th>Rol</th><th>Acción</th></tr></thead>
                <tbody id="tbl"></tbody>
            </table>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        SYSTEM.checkSecurity();
        if(SYSTEM.getActiveUser().role !== 'admin') window.location.href = 'index.html';

        const render = () => {
            const db = JSON.parse(localStorage.getItem('sv_users'));
            const tbody = document.getElementById('tbl');
            tbody.innerHTML = '';
            db.forEach((u, i) => {
                tbody.innerHTML += `<tr><td>${u.name}</td><td>${u.user}</td><td>${u.role}</td>
                <td><button onclick="del(${i})" class="btn btn-danger" style="padding:4px">X</button></td></tr>`;
            });
        };

        document.getElementById('formUsr').addEventListener('submit', e => {
            e.preventDefault();
            const db = JSON.parse(localStorage.getItem('sv_users'));
            db.push({
                name: document.getElementById('name').value,
                user: document.getElementById('user').value,
                pass: document.getElementById('pass').value,
                role: document.getElementById('rol').value
            });
            localStorage.setItem('sv_users', JSON.stringify(db));
            render(); e.target.reset();
        });

        window.del = i => {
            const db = JSON.parse(localStorage.getItem('sv_users'));
            if(db[i].user === SYSTEM.getActiveUser().user) return alert('No te puedes borrar a ti mismo');
            if(confirm('Eliminar?')) {
                db.splice(i, 1);
                localStorage.setItem('sv_users', JSON.stringify(db));
                render();
            }
        };
        render();
    </script>
</body>
</html>
