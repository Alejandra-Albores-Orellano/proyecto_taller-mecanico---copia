<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>QA Testing</title>
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        .pass { color: var(--success); font-weight: bold; }
        .fail { color: var(--danger); font-weight: bold; }
        .log-box { background: #1e272e; color: #ccc; padding: 15px; font-family: monospace; border-radius: 5px; height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content">
        <h2>Módulo de Pruebas (Unitarias e Integración)</h2>
        <button onclick="runTests()" class="btn btn-primary">Ejecutar Suite de Pruebas</button>
        <br><br>
        <div class="card">
            <div id="console" class="log-box">Esperando ejecución...</div>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        APP.checkAuth();
        const log = (msg, type='info') => {
            const el = document.getElementById('console');
            const color = type === 'pass' ? '#2ecc71' : type === 'fail' ? '#e74c3c' : '#bdc3c7';
            el.innerHTML += `<div style="color:${color}">> ${msg}</div>`;
            el.scrollTop = el.scrollHeight;
        };

        function assert(condition, testName) {
            if(condition) log(`[PASS] ${testName}`, 'pass');
            else log(`[FAIL] ${testName}`, 'fail');
        }

        function runTests() {
            document.getElementById('console').innerHTML = '';
            log('INICIANDO PRUEBAS UNITARIAS (Min. 10 Casos)...');

            // 1. Test Login Admin
            assert(APP.login('admin', '123') === true, 'Login Admin correcto');
            
            // 2. Test Login Fallido
            assert(APP.login('admin', 'wrong') === false, 'Login Contraseña incorrecta detectada');

            // 3. Crear Cliente
            const client = APP.DAO.createClient({ nombre: 'Test User', vehiculo: 'Test Car' });
            assert(client.id !== undefined, 'Creación de Cliente retorna objeto con ID');

            // 4. Leer Clientes
            const clients = APP.DAO.getClients();
            assert(clients.length > 0, 'Lectura de Clientes retorna array con datos');

            // 5. Crear Producto
            APP.DAO.createProduct({ sku: 'TEST-01', stock: 10 });
            const inv = APP.DAO.getInventory();
            assert(inv.find(p => p.sku === 'TEST-01') !== undefined, 'Producto creado en inventario');

            // 6. Crear Orden
            const order = APP.DAO.createOrder({ clientId: client.id, falla: 'Falla Test' });
            assert(order.status === 'Pendiente', 'Orden creada con estado inicial Pendiente');

            // 7. Update Orden (Mecánico flow)
            APP.DAO.updateOrder(order.id, { status: 'En Proceso', workNotes: 'Trabajando' });
            const updatedOrder = APP.DAO.getOrders().find(o => o.id === order.id);
            assert(updatedOrder.status === 'En Proceso', 'Actualización de estado de orden correcta');

            // 8. Verificar notas mecánico
            assert(updatedOrder.workNotes === 'Trabajando', 'Notas de mecánico guardadas correctamente');

            // 9. Borrar Orden
            APP.DAO.deleteOrder(order.id);
            assert(APP.DAO.getOrders().find(o => o.id === order.id) === undefined, 'Eliminación de orden correcta');

            // 10. Borrar Cliente
            APP.DAO.deleteClient(client.id);
            assert(APP.DAO.getClients().find(c => c.id === client.id) === undefined, 'Eliminación de cliente correcta');

            log('------------------------------------------------');
            log('INICIANDO PRUEBA DE INTEGRACIÓN (Flujo Completo)...');
            
            try {
                // Paso A: Recepción crea cliente
                const flowClient = APP.DAO.createClient({ nombre: 'Integration User', vehiculo: 'Ford' });
                log('1. Cliente registrado');
                
                // Paso B: Recepción crea orden
                const flowOrder = APP.DAO.createOrder({ clientId: flowClient.id, falla: 'Motor' });
                log('2. Orden generada');
                
                // Paso C: Mecánico actualiza
                APP.DAO.updateOrder(flowOrder.id, { status: 'Terminado' });
                log('3. Mecánico finalizó trabajo');
                
                // Paso D: Verificar final
                const finalCheck = APP.DAO.getOrders().find(o => o.id === flowOrder.id);
                
                assert(finalCheck.status === 'Terminado' && finalCheck.clientId === flowClient.id, 'Flujo completo Cliente->Orden->Mecánico verificado');
                
                // Limpieza
                APP.DAO.deleteClient(flowClient.id);
                APP.DAO.deleteOrder(flowOrder.id);

            } catch(e) {
                log('Error en integración: ' + e.message, 'fail');
            }
        }
    </script>
</body>
</html>
