<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>QA Testing</title>
    <link rel="stylesheet" href="css/estilos.css">
    <style>.console { background:#2c3e50; color:#ecf0f1; padding:15px; font-family:monospace; height:400px; overflow-y:auto; border-radius:4px; }</style>
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content">
        <h2>Módulo de Pruebas (QA)</h2>
        <p>Ejecución de Pruebas Unitarias (10 Casos) e Integración de Sistema.</p>
        <button class="btn btn-primary" onclick="runTests()">EJECUTAR SUITE DE PRUEBAS</button>
        <br><br>
        <div class="console" id="log">Esperando ejecución...</div>
    </div>
    <script src="js/app.js"></script>
    <script>
        APP.checkAuth();
        
        function logger(msg, type) {
            const l = document.getElementById('log');
            const color = type ? '#2ecc71' : '#e74c3c'; // Verde o Rojo
            const icon = type ? '✔ PASS' : '✖ FAIL';
            l.innerHTML += `<div style="color:${color}; margin-bottom:5px;">[${icon}] ${msg}</div>`;
            l.scrollTop = l.scrollHeight;
        }

        function runTests() {
            document.getElementById('log').innerHTML = 'INICIANDO PRUEBAS...<br>-----------------------<br>';
            
            try {
                // PRUEBAS UNITARIAS (Componentes individuales)
                logger('1. Auth: Login Admin correcto', APP.login('admin', '123') === true);
                logger('2. Auth: Login Contraseña incorrecta rechazada', APP.login('admin', 'xxx') === false);
                
                const cli = APP.DAO.createClient({ nombre: 'Test QA', telefono: '555' });
                logger('3. CRUD Cliente: Creación exitosa', cli.id !== undefined);
                
                const veh = APP.DAO.createVehicle({ idCliente: cli.id, modelo: 'QA Car', placas: 'QA-01' });
                logger('4. CRUD Vehículo: Creación exitosa', veh.id !== undefined);
                
                const inv = APP.DAO.createProduct({ sku: 'QA-PART', stock: 10, min: 2 });
                logger('5. CRUD Inventario: Creación exitosa', inv.id !== undefined);
                
                const ord = APP.DAO.createOrder({ idVehiculo: veh.id, falla: 'Falla Test' });
                logger('6. Orden: Estado inicial es "Pendiente"', ord.idEstado === 'Pendiente');
                
                // Simular Mecánico
                const update = APP.DAO.updateOrderMechanic(ord.id, 'Trabajo QA', 'En Proceso');
                logger('7. Lógica Mecánico: Actualización permitida', update === true);
                
                const ordCheck = APP.DAO.getOrders().find(o => o.id === ord.id);
                logger('8. Persistencia: Estado cambiado a "En Proceso"', ordCheck.idEstado === 'En Proceso');
                
                APP.DAO.deleteOrder(ord.id);
                const delCheck = APP.DAO.getOrders().find(o => o.id === ord.id);
                logger('9. Admin: Eliminación de orden correcta', delCheck === undefined);

                const stockCheck = APP.DAO.getInventory();
                logger('10. Inventario: Lectura de datos correcta', stockCheck.length > 0);

                // PRUEBA DE INTEGRACIÓN (Flujo Completo)
                document.getElementById('log').innerHTML += '<br>PRUEBA DE INTEGRACIÓN<br>-----------------------<br>';
                
                // Flujo: Recepción Crea -> Mecánico Repara -> Sistema verifica
                const iCli = APP.DAO.createClient({nombre: 'Integration'});
                const iVeh = APP.DAO.createVehicle({idCliente: iCli.id, modelo: 'IntCar', placas: 'INT-99'});
                const iOrd = APP.DAO.createOrder({idVehiculo: iVeh.id, falla: 'Ruido Motor'});
                
                APP.DAO.updateOrderMechanic(iOrd.id, 'Motor Reparado', 'Terminado');
                
                const finalOrd = APP.DAO.getOrders().find(o => o.id === iOrd.id);
                
                const integracionExitosa = (
                    finalOrd.idVehiculo === iVeh.id && 
                    finalOrd.idEstado === 'Terminado' && 
                    finalOrd.observacionesMecanico === 'Motor Reparado'
                );
                
                logger('FLUJO COMPLETO: Cliente -> Vehículo -> Orden -> Reparación -> Cierre', integracionExitosa);

            } catch(e) {
                logger('Error Crítico en Pruebas: ' + e.message, false);
            }
        }
    </script>
</body>
</html>
