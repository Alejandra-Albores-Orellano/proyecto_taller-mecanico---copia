<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - ServiTaller</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="login-page">
    <div class="card" style="width: 350px; text-align: center;">
        <h2>ServiTaller</h2>
        <p>Sistema de Gestión Integral</p>
        <form id="loginForm">
            <input type="text" id="user" placeholder="Usuario" required>
            <input type="password" id="pass" placeholder="Contraseña" required>
            <button type="submit" class="btn btn-primary" style="width:100%">Ingresar</button>
        </form>
        <div style="margin-top:15px; font-size:0.8rem; color:#777; text-align:left;">
            <p><strong>Credenciales (Demo):</strong><br>Admin: admin/123<br>Recepción: recepcion/123<br>Mecánico: mecanico/123</p>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        APP.initDB();
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            if(APP.login(document.getElementById('user').value, document.getElementById('pass').value)) {
                window.location.href = 'index.html';
            } else { alert('Credenciales incorrectas'); }
        });
    </script>
</body>
</html>
