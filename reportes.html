<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportes</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content">
        <h2>Reportes y Estadísticas</h2>
        
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3>Histórico de Órdenes</h3>
                <div>
                    <label style="display:inline">Filtrar por Estado:</label>
                    <select id="filtro" onchange="filtrar()" style="width:200px; display:inline-block">
                        <option value="all">Todos</option>
                        <option value="Pendiente">Pendientes</option>
                        <option value="En Proceso">En Proceso</option>
                        <option value="Terminado">Terminados</option>
                    </select>
                </div>
            </div>
            <table>
                <thead><tr><th>ID Orden</th><th>Fecha Ingreso</th><th>Vehículo</th><th>Falla</th><th>Estado Final</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        APP.checkAuth();
        // Restricción de seguridad
        if(APP.getSession().rol !== 1) { alert('Acceso denegado'); location.href='index.html'; }

        const vehs = APP.DAO.getVehicles();

        function filtrar() {
            const f = document.getElementById('filtro').value;
            let data = APP.DAO.getOrders();
            if(f !== 'all') data = data.filter(o => o.idEstado === f);
            
            const tbody = document.getElementById('tbody');
            tbody.innerHTML = '';
            
            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center">No se encontraron datos</td></tr>';
                return;
            }

            data.forEach(o => {
                const v = vehs.find(x => x.id == o.idVehiculo) || {};
                tbody.innerHTML += `<tr><td>${o.id}</td><td>${o.fecha}</td><td>${v.modelo}</td><td>${o.falla}</td><td>${o.idEstado}</td></tr>`;
            });
        }
        filtrar();
    </script>
</body>
</html>
