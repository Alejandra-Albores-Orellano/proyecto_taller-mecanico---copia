<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportes</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content">
        <h2>Reportes del Sistema</h2>
        
        <div class="row">
            <div class="col"><div class="card" style="border-left:5px solid #2980b9"><h3>Total Órdenes</h3><h1 id="total-ops">0</h1></div></div>
            <div class="col"><div class="card" style="border-left:5px solid #27ae60"><h3>Terminadas</h3><h1 id="total-fin">0</h1></div></div>
            <div class="col"><div class="card" style="border-left:5px solid #e74c3c"><h3>Pendientes</h3><h1 id="total-pen">0</h1></div></div>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>Detalle de Operaciones</h3>
                <select id="filterState" onchange="filterReport()" style="width:200px;">
                    <option value="all">Todos los estados</option>
                    <option value="Pendiente">Pendientes</option>
                    <option value="En Proceso">En Proceso</option>
                    <option value="Terminado">Terminados</option>
                </select>
            </div>
            <table>
                <thead><tr><th>ID</th><th>Falla</th><th>Estado</th><th>Fecha</th></tr></thead>
                <tbody id="reportTable"></tbody>
            </table>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        APP.checkAuth();
        
        // Restricción: Solo Admin
        if(APP.getSession().role !== 'admin') {
            alert('Acceso denegado'); window.location.href = 'index.html';
        }

        function loadStats() {
            const orders = APP.DAO.getOrders();
            document.getElementById('total-ops').innerText = orders.length;
            document.getElementById('total-fin').innerText = orders.filter(o => o.status === 'Terminado').length;
            document.getElementById('total-pen').innerText = orders.filter(o => o.status === 'Pendiente').length;
            renderTable(orders);
        }

        function renderTable(data) {
            const tbody = document.getElementById('reportTable');
            tbody.innerHTML = '';
            data.forEach(o => {
                tbody.innerHTML += `<tr><td>#${o.id}</td><td>${o.falla}</td><td>${o.status}</td><td>${new Date(o.id).toLocaleDateString()}</td></tr>`;
            });
        }

        function filterReport() {
            const filter = document.getElementById('filterState').value;
            let orders = APP.DAO.getOrders();
            if(filter !== 'all') {
                orders = orders.filter(o => o.status === filter);
            }
            renderTable(orders);
        }

        loadStats();
    </script>
</body>
</html>
