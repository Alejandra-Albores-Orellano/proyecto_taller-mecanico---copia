<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content">
        <h2>Gestión de Clientes</h2>
        <div class="card" id="formCard">
            <h3>Nuevo Cliente</h3>
            <form id="formClient">
                <div class="row">
                    <input type="text" id="nom" placeholder="Nombre Completo" required>
                    <input type="tel" id="tel" placeholder="Teléfono" required>
                </div>
                <div class="row">
                    <input type="text" id="veh" placeholder="Vehículo (Marca Modelo)" required>
                    <input type="text" id="pla" placeholder="Placas" required>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>
        </div>
        <div class="card">
            <table>
                <thead><tr><th>Nombre</th><th>Teléfono</th><th>Vehículo</th><th>Placas</th><th>Acciones</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        APP.checkAuth();
        const user = APP.getSession();
        if(user.role === 'mecanico') document.getElementById('formCard').style.display = 'none';

        function render() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            APP.DAO.getClients().forEach(c => {
                const btnDel = user.role === 'admin' ? `<button onclick="del(${c.id})" class="btn btn-danger">X</button>` : '';
                tbody.innerHTML += `<tr><td>${c.nombre}</td><td>${c.telefono}</td><td>${c.vehiculo}</td><td>${c.placas}</td><td>${btnDel}</td></tr>`;
            });
        }

        document.getElementById('formClient').addEventListener('submit', (e) => {
            e.preventDefault();
            APP.DAO.createClient({
                nombre: document.getElementById('nom').value,
                telefono: document.getElementById('tel').value,
                vehiculo: document.getElementById('veh').value,
                placas: document.getElementById('pla').value
            });
            e.target.reset(); render();
        });

        window.del = (id) => { if(confirm('Borrar?')) { APP.DAO.deleteClient(id); render(); } };
        render();
    </script>
</body>
</html>
