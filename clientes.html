<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content">
        <h2>Clientes y Vehículos</h2>
        <div class="card" id="panelAgregar">
            <h3>Registrar Nuevo</h3>
            <form id="formCli">
                <div class="form-row">
                    <div class="form-col"><label>Nombre</label><input type="text" id="nom" required></div>
                    <div class="form-col"><label>Teléfono</label><input type="text" id="tel" required></div>
                </div>
                <h4 style="margin-top:15px;color:#777">Datos Vehículo</h4>
                <div class="form-row">
                    <div class="form-col"><label>Marca/Modelo</label><input type="text" id="mod" required></div>
                    <div class="form-col"><label>Placas</label><input type="text" id="pla" onkeyup="this.value=this.value.toUpperCase()" required></div>
                    <div class="form-col"><label>Color</label><input type="text" id="col" required></div>
                </div>
                <button class="btn btn-primary" style="margin-top:20px">Guardar</button>
            </form>
        </div>
        <div class="card">
            <h3>Directorio</h3>
            <table>
                <thead><tr><th>Cliente</th><th>Teléfono</th><th>Vehículo</th><th>Placas</th><th>Acción</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        APP.checkAuth();
        const session = APP.getSession();
        if(session.rol === 3) document.getElementById('panelAgregar').style.display = 'none';

        function render() {
            const tbody = document.getElementById('tbody');
            tbody.innerHTML = '';
            const list = APP.DAO.getClients();
            const vehs = APP.DAO.getVehicles();
            
            list.forEach(c => {
                const v = vehs.find(x => x.idCliente === c.id) || {};
                let btn = session.rol === 1 ? `<button onclick="del(${c.id})" class="btn btn-danger btn-sm">Eliminar</button>` : '--';
                tbody.innerHTML += `<tr><td>${c.nombre}</td><td>${c.telefono}</td><td>${v.modelo}</td><td><span class="badge bg-process">${v.placas}</span></td><td>${btn}</td></tr>`;
            });
        }

        document.getElementById('formCli').onsubmit = (e) => {
            e.preventDefault();
            
            // 1. Intentar crear Cliente
            const resCli = APP.DAO.createClient({ 
                nombre: document.getElementById('nom').value,
                telefono: document.getElementById('tel').value 
            });

            if(!resCli.success) {
                alert(resCli.msg); // Error: Cliente duplicado
                return;
            }

            // 2. Intentar crear Vehículo
            const resVeh = APP.DAO.createVehicle({ 
                idCliente: resCli.data.id, 
                modelo: document.getElementById('mod').value, 
                placas: document.getElementById('pla').value.toUpperCase(),
                color: document.getElementById('col').value
            });

            if(!resVeh.success) {
                alert(resVeh.msg); // Error: Placas duplicadas
                // Rollback: Borrar el cliente creado porque falló el vehículo
                APP.DAO.deleteClient(resCli.data.id);
                return;
            }

            alert('Registro exitoso');
            e.target.reset(); render();
        };

        window.del = (id) => {
            if(confirm('¿Eliminar Cliente y Vehículo?')) { APP.DAO.deleteClient(id); render(); }
        };
        render();
    </script>
</body>
</html>
