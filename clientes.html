<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content">
        <h2>Gestión de Clientes y Vehículos</h2>
        
        <div class="card form-creation-container">
            <h3>Nuevo Registro</h3>
            <form id="formClient">
                <div class="form-row">
                    <div class="form-group"><label>Nombre Completo</label><input type="text" id="nom" required></div>
                    <div class="form-group"><label>Teléfono</label><input type="tel" id="tel" required></div>
                    <div class="form-group"><label>Email</label><input type="email" id="mail"></div>
                </div>
                <div class="form-group"><label>Dirección</label><input type="text" id="dir" placeholder="Calle, Número, Colonia..."></div>
                
                <h4 style="margin-top:15px; border-bottom:1px solid #eee">Datos del Vehículo</h4>
                <div class="form-row">
                    <div class="form-group"><label>Marca</label><input type="text" id="mar" required></div>
                    <div class="form-group"><label>Modelo</label><input type="text" id="mod" required></div>
                    <div class="form-group"><label>Año</label><input type="number" id="anio" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Placas</label><input type="text" id="pla" required></div>
                    <div class="form-group"><label>VIN</label><input type="text" id="vin"></div>
                    <div class="form-group"><label>Color</label><input type="text" id="col"></div>
                </div>
                <button type="submit" class="btn btn-primary">Guardar Cliente y Vehículo</button>
            </form>
        </div>

        <div class="card">
            <h3>Cartera de Clientes</h3>
            <table>
                <thead><tr><th>Cliente</th><th>Contacto</th><th>Vehículo</th><th>Placa</th><th>Acción</th></tr></thead>
                <tbody id="tbl"></tbody>
            </table>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        SYSTEM.checkSecurity();
        const render = () => {
            const db = JSON.parse(localStorage.getItem('sv_clientes')||'[]');
            const tbody = document.getElementById('tbl');
            tbody.innerHTML = '';
            db.forEach((c, i) => {
                tbody.innerHTML += `<tr>
                    <td>${c.nombre}</td><td>${c.tel}</td><td>${c.auto}</td><td>${c.placa}</td>
                    <td><button onclick="del(${i})" class="btn btn-danger btn-delete" style="padding:4px 8px; font-size:0.8rem">Eliminar</button></td>
                </tr>`;
            });
            SYSTEM.applyUIRestrictions(SYSTEM.getActiveUser()); // Re-aplicar restricciones tras renderizar
        };
        
        document.getElementById('formClient').addEventListener('submit', e => {
            e.preventDefault();
            const data = {
                id: Date.now(),
                nombre: document.getElementById('nom').value,
                tel: document.getElementById('tel').value,
                auto: `${document.getElementById('mar').value} ${document.getElementById('mod').value}`,
                placa: document.getElementById('pla').value
            };
            const db = JSON.parse(localStorage.getItem('sv_clientes')||'[]');
            db.push(data);
            localStorage.setItem('sv_clientes', JSON.stringify(db));
            render(); e.target.reset();
        });

        window.del = i => {
            if(confirm('¿Borrar cliente?')) {
                const db = JSON.parse(localStorage.getItem('sv_clientes'));
                db.splice(i, 1);
                localStorage.setItem('sv_clientes', JSON.stringify(db));
                render();
            }
        };
        render();
    </script>
</body>
</html>
