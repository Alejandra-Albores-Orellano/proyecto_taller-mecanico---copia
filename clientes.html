<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content">
        <h2>Gestión de Clientes y Vehículos</h2>
        
        <div class="card" id="panelAgregar">
            <h3>Registrar Nuevo Cliente</h3>
            <form id="formCli">
                <div class="form-row">
                    <div class="form-col"><label>Nombre Completo</label><input type="text" id="nom" required></div>
                    <div class="form-col"><label>Teléfono</label><input type="text" id="tel" required></div>
                </div>
                <h4 style="margin-top:20px; color:#7f8c8d">Datos del Vehículo</h4>
                <div class="form-row">
                    <div class="form-col"><label>Marca y Modelo</label><input type="text" id="mod" required></div>
                    <div class="form-col"><label>Placas</label><input type="text" id="pla" required></div>
                    <div class="form-col"><label>Color</label><input type="text" id="col" required></div>
                </div>
                <button class="btn btn-primary" style="margin-top:20px">Guardar Registro</button>
            </form>
        </div>

        <div class="card">
            <h3>Directorio</h3>
            <table>
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Teléfono</th>
                        <th>Vehículo</th>
                        <th>Placas</th>
                        <th>Acciones</th> </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        APP.checkAuth();
        const session = APP.getSession();

        // Si es mecánico, ocultamos el formulario de agregar (Solo lectura)
        if(session.rol === 3) document.getElementById('panelAgregar').style.display = 'none';

        function render() {
            const list = APP.DAO.getClients();
            const vehs = APP.DAO.getVehicles();
            const tbody = document.getElementById('tbody');
            tbody.innerHTML = '';
            
            list.forEach(c => {
                const v = vehs.find(x => x.idCliente === c.id) || {};
                
                // BOTÓN ELIMINAR: Solo visible para ADMIN (rol 1)
                let deleteBtn = '';
                if (session.rol === 1) {
                    deleteBtn = `<button onclick="del(${c.id})" class="btn btn-danger btn-sm">Eliminar</button>`;
                } else {
                    deleteBtn = '<small style="color:#ccc">--</small>';
                }

                tbody.innerHTML += `<tr>
                    <td>${c.nombre}</td>
                    <td>${c.telefono}</td>
                    <td>${v.modelo} (${v.color})</td>
                    <td><span class="badge bg-process">${v.placas}</span></td>
                    <td>${deleteBtn}</td>
                </tr>`;
            });
        }

        document.getElementById('formCli').onsubmit = (e) => {
            e.preventDefault();
            const cli = APP.DAO.createClient({ 
                nombre: document.getElementById('nom').value,
                telefono: document.getElementById('tel').value 
            });
            APP.DAO.createVehicle({ 
                idCliente: cli.id, 
                modelo: document.getElementById('mod').value, 
                placas: document.getElementById('pla').value,
                color: document.getElementById('col').value
            });
            e.target.reset(); render();
        };

        // Función Eliminar
        window.del = (id) => {
            if(confirm('¿Eliminar Cliente y sus Vehículos?')) {
                APP.DAO.deleteClient(id);
                render();
            }
        };

        render();
    </script>
</body>
</html>
