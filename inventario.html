<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content">
        <h2>Control de Inventario</h2>
        <div class="card">
            <p style="color:#7f8c8d; font-size:0.9rem; margin-bottom:15px;">
                <i class="fas fa-info-circle"></i> Si ingresa un SKU existente, el stock se sumará al actual automáticamente.
            </p>
            <form id="formInv" class="form-row">
                <input class="form-col" type="text" id="sku" placeholder="SKU (Código)" onkeyup="this.value = this.value.toUpperCase();" required>
                <input class="form-col" type="text" id="nom" placeholder="Producto" required>
                <input class="form-col" type="number" id="stk" placeholder="Cant. Entrada" min="1" required>
                <input class="form-col" type="number" id="min" placeholder="Mínimo" required>
                <input class="form-col" type="number" id="pre" placeholder="Precio" required>
                <button class="btn btn-primary">Guardar Entrada</button>
            </form>
        </div>
        <div class="card">
            <table>
                <thead><tr><th>SKU</th><th>Refacción</th><th>Stock Actual</th><th>Estado</th><th>Precio</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        APP.checkAuth();
        
        function render() {
            const tbody = document.getElementById('tbody');
            const inv = APP.DAO.getInventory();
            tbody.innerHTML = '';
            
            // Ordenar para ver los recién modificados arriba (opcional)
            // inv.sort((a, b) => b.id - a.id); 

            inv.forEach(i => {
                // Alerta visual de stock
                const stockVal = parseInt(i.stock);
                const minVal = parseInt(i.min);
                let status = '<span class="badge btn-success">OK</span>';
                
                if(stockVal === 0) status = '<span class="badge btn-danger">AGOTADO</span>';
                else if(stockVal <= minVal) status = '<span class="badge bg-pending">BAJO STOCK</span>';
                
                tbody.innerHTML += `<tr>
                    <td><b>${i.sku}</b></td>
                    <td>${i.nombre}</td>
                    <td style="font-size:1.1rem">${stockVal}</td>
                    <td>${status}</td>
                    <td>$${i.precio}</td>
                </tr>`;
            });
        }

        document.getElementById('formInv').onsubmit = (e) => {
            e.preventDefault();
            
            const skuInput = document.getElementById('sku').value.toUpperCase().trim();
            
            const resultado = APP.DAO.createProduct({
                sku: skuInput,
                nombre: document.getElementById('nom').value,
                stock: document.getElementById('stk').value, // Se enviará como string, el DAO lo parsea
                min: document.getElementById('min').value,
                precio: document.getElementById('pre').value
            });

            // Feedback al usuario
            if (resultado.status === 'updated') {
                alert(`✅ PRODUCTO ACTUALIZADO\nSe sumó el stock al SKU: ${resultado.data.sku}\nNuevo Stock Total: ${resultado.data.stock}`);
            } else {
                alert(`✨ PRODUCTO CREADO\nSe registró el nuevo SKU: ${resultado.data.sku}`);
            }

            e.target.reset(); 
            render();
        };
        
        render();
    </script>
</body>
</html>
