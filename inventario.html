<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content">
        <h2>Control de Inventario</h2>
        <div class="card">
            <form id="formInv" class="form-row">
                <input class="form-col" type="text" id="sku" placeholder="SKU" required>
                <input class="form-col" type="text" id="nom" placeholder="Producto" required>
                <input class="form-col" type="number" id="stk" placeholder="Stock" required>
                <input class="form-col" type="number" id="min" placeholder="Mínimo" required>
                <input class="form-col" type="number" id="pre" placeholder="Precio" required>
                <button class="btn btn-primary">Agregar</button>
            </form>
        </div>
        <div class="card">
            <table>
                <thead><tr><th>SKU</th><th>Refacción</th><th>Stock Actual</th><th>Estado</th><th>Precio</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        APP.checkAuth();
        function render() {
            const tbody = document.getElementById('tbody');
            const inv = APP.DAO.getInventory();
            tbody.innerHTML = '';
            inv.forEach(i => {
                const status = i.stock <= i.min ? '<span class="badge btn-danger">BAJO STOCK</span>' : '<span class="badge btn-success">OK</span>';
                tbody.innerHTML += `<tr><td>${i.sku}</td><td>${i.nombre}</td><td>${i.stock}</td><td>${status}</td><td>$${i.precio}</td></tr>`;
            });
        }
        document.getElementById('formInv').onsubmit = (e) => {
            e.preventDefault();
            APP.DAO.createProduct({
                sku: document.getElementById('sku').value,
                nombre: document.getElementById('nom').value,
                stock: document.getElementById('stk').value,
                min: document.getElementById('min').value,
                precio: document.getElementById('pre').value
            });
            e.target.reset(); render();
        };
        render();
    </script>
</body>
</html>
