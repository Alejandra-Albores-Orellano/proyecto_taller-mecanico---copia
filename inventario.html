<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content">
        <h2>Inventario de Refacciones</h2>
        
        <div class="card form-creation-container">
            <h3>Ingresar Refacción</h3>
            <form id="formInv">
                <div class="form-row">
                    <div class="form-group"><label>SKU</label><input type="text" id="sku" required></div>
                    <div class="form-group"><label>Producto</label><input type="text" id="nom" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Stock</label><input type="number" id="stk" required></div>
                    <div class="form-group"><label>Mínimo</label><input type="number" id="min" required></div>
                    <div class="form-group"><label>Precio</label><input type="number" id="pre" required></div>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>
        </div>

        <div class="card">
            <h3>Existencias</h3>
            <table>
                <thead><tr><th>SKU</th><th>Producto</th><th>Stock</th><th>Precio</th><th>Estado</th><th>Acción</th></tr></thead>
                <tbody id="tbl"></tbody>
            </table>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        SYSTEM.checkSecurity();
        const render = () => {
            const db = JSON.parse(localStorage.getItem('sv_inventario')||'[]');
            const tbody = document.getElementById('tbl');
            tbody.innerHTML = '';
            db.forEach((p, i) => {
                let alert = p.stock <= p.min ? '<span style="color:red; font-weight:bold">BAJO STOCK</span>' : '<span style="color:green">OK</span>';
                tbody.innerHTML += `<tr>
                    <td>${p.sku}</td><td>${p.nombre}</td><td>${p.stock}</td><td>$${p.precio}</td><td>${alert}</td>
                    <td><button onclick="del(${i})" class="btn btn-danger btn-delete" style="padding:4px">X</button></td>
                </tr>`;
            });
            SYSTEM.applyUIRestrictions(SYSTEM.getActiveUser());
        };

        document.getElementById('formInv').addEventListener('submit', e => {
            e.preventDefault();
            const data = {
                sku: document.getElementById('sku').value,
                nombre: document.getElementById('nom').value,
                stock: parseInt(document.getElementById('stk').value),
                min: parseInt(document.getElementById('min').value),
                precio: document.getElementById('pre').value
            };
            const db = JSON.parse(localStorage.getItem('sv_inventario')||'[]');
            db.push(data);
            localStorage.setItem('sv_inventario', JSON.stringify(db));
            render(); e.target.reset();
        });

        window.del = i => {
            if(confirm('Eliminar?')) {
                const db = JSON.parse(localStorage.getItem('sv_inventario'));
                db.splice(i, 1);
                localStorage.setItem('sv_inventario', JSON.stringify(db));
                render();
            }
        };
        render();
    </script>
</body>
</html>
