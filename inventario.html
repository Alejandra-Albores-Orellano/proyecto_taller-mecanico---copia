<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content">
        <h2>Inventario</h2>
        <div class="card" id="formCard">
            <form id="formInv">
                <div class="row">
                    <input type="text" id="sku" placeholder="SKU" required>
                    <input type="text" id="nom" placeholder="Producto" required>
                </div>
                <div class="row">
                    <input type="number" id="stock" placeholder="Stock" required>
                    <input type="number" id="min" placeholder="Mínimo" required>
                    <input type="number" id="price" placeholder="Precio" required>
                </div>
                <button type="submit" class="btn btn-primary">Agregar</button>
            </form>
        </div>
        <div class="card">
            <table>
                <thead><tr><th>SKU</th><th>Producto</th><th>Stock</th><th>Estado</th><th>Acción</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        APP.checkAuth();
        const user = APP.getSession();
        if(user.role === 'mecanico') document.getElementById('formCard').style.display = 'none';

        function render() {
            const tbody = document.getElementById('tbody');
            tbody.innerHTML = '';
            APP.DAO.getInventory().forEach(p => {
                const stock = parseInt(p.stock);
                const min = parseInt(p.min);
                let status = stock <= min ? '<span style="color:red; font-weight:bold">BAJO STOCK</span>' : 'OK';
                const btn = user.role === 'admin' ? `<button onclick="del(${p.id})" class="btn btn-danger">X</button>` : '';
                
                tbody.innerHTML += `<tr><td>${p.sku}</td><td>${p.nombre}</td><td>${stock}</td><td>${status}</td><td>${btn}</td></tr>`;
            });
        }

        document.getElementById('formInv').addEventListener('submit', (e) => {
            e.preventDefault();
            APP.DAO.createProduct({
                sku: document.getElementById('sku').value,
                nombre: document.getElementById('nom').value,
                stock: document.getElementById('stock').value,
                min: document.getElementById('min').value,
                precio: document.getElementById('price').value
            });
            e.target.reset(); render();
        });

        window.del = (id) => { if(confirm('Borrar?')) { APP.DAO.deleteProduct(id); render(); } };
        render();
    </script>
</body>
</html>
