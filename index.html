<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content">
        <h1>Bienvenido al Sistema</h1>
        <div class="row">
            <div class="col"><div class="card"><h3>Órdenes Activas</h3><p id="count-orders">0</p></div></div>
            <div class="col"><div class="card"><h3>Clientes</h3><p id="count-clients">0</p></div></div>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        APP.checkAuth();
        document.getElementById('count-orders').innerText = APP.DAO.getOrders().length;
        document.getElementById('count-clients').innerText = APP.DAO.getClients().length;
    </script>
</body>
</html>
