<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Órdenes</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content">
        <h2>Órdenes de Trabajo</h2>
        
        <div class="card" id="panelCreate">
            <h3><span style="color:var(--accent)">+</span> Nueva Orden</h3>
            <form id="formOrd">
                <div class="form-group">
                    <label>Seleccionar Vehículo</label>
                    <select id="selCli" required><option value="">Buscar...</option></select>
                </div>
                <div class="form-group">
                    <label>Falla Reportada / Motivo Ingreso</label>
                    <textarea id="falla" rows="3" required></textarea>
                </div>
                <button class="btn btn-primary">Generar Orden</button>
            </form>
        </div>

        <div class="card">
            <h3>Tablero de Control</h3>
            <table>
                <thead><tr><th>ID</th><th>Vehículo</th><th>Falla</th><th>Bitácora Mecánico</th><th>Estado</th><th>Acción</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>

    <div id="modalDetalle" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModal()">&times;</span>
            <h2 style="margin-top:0">Detalle de Orden</h2>
            <div id="modalBody">
                </div>
            <br>
            <button class="btn btn-primary" onclick="cerrarModal()" style="width:100%">Cerrar</button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        APP.checkAuth();
        const user = APP.getSession();
        
        // Ocultar panel de crear SOLO si es mecánico (Rol 3)
        if(user.rol === 3) document.getElementById('panelCreate').style.display = 'none';

        // Cargar selects
        const vehs = APP.DAO.getVehicles();
        const sel = document.getElementById('selCli');
        const clients = APP.DAO.getClients(); // Necesario para ver nombre del cliente en el modal

        vehs.forEach(v => sel.innerHTML += `<option value="${v.id}">${v.modelo} - ${v.placas}</option>`);

        function render() {
            const ords = APP.DAO.getOrders();
            const tbody = document.getElementById('tbody');
            tbody.innerHTML = '';
            
            ords.forEach(o => {
                const v = vehs.find(x => x.id == o.idVehiculo) || { modelo: '?', placas: '?' };
                
                let bitacora = o.observacionesMecanico || '<em style="color:#999">Sin registros</em>';
                let estadoBadge = `<span class="badge ${o.idEstado==='Terminado'?'bg-done':'bg-pending'}">${o.idEstado}</span>`;
                let accion = '';

                if(user.rol === 3) { // VISTA MECÁNICO
                    bitacora = `<textarea id="txt-${o.id}" placeholder="Trabajo...">${o.observacionesMecanico || ''}</textarea>`;
                    estadoBadge = `<select id="est-${o.id}">
                        <option ${o.idEstado=='Pendiente'?'selected':''}>Pendiente</option>
                        <option ${o.idEstado=='En Proceso'?'selected':''}>En Proceso</option>
                        <option ${o.idEstado=='Terminado'?'selected':''}>Terminado</option>
                    </select>`;
                    accion = `<button onclick="save(${o.id})" class="btn btn-success btn-sm">Guardar</button>`;
                } 
                else if (user.rol === 1) { // VISTA ADMIN (Rol 1) -> Botón Eliminar + Ver
                    accion = `
                        <button onclick="verOrden(${o.id})" class="btn btn-primary btn-sm" style="background:#3498db">Ver</button>
                        <button onclick="del(${o.id})" class="btn btn-danger btn-sm">X</button>
                    `;
                }
                else { // VISTA RECEPCIÓN (Rol 2) -> Botón Ver Detalle
                    accion = `<button onclick="verOrden(${o.id})" class="btn btn-primary btn-sm" style="background:#3498db">Ver Detalle</button>`;
                }

                tbody.innerHTML += `<tr>
                    <td>#${o.id}</td>
                    <td><b>${v.modelo}</b><br><small>${v.placas}</small></td>
                    <td>${o.falla}</td>
                    <td>${bitacora}</td>
                    <td>${estadoBadge}</td>
                    <td>${accion}</td>
                </tr>`;
            });
        }

        document.getElementById('formOrd').onsubmit = (e) => {
            e.preventDefault();
            APP.DAO.createOrder({
                idVehiculo: document.getElementById('selCli').value,
                falla: document.getElementById('falla').value
            });
            render(); e.target.reset();
        };

        window.save = (id) => {
            APP.DAO.updateOrderMechanic(id, document.getElementById(`txt-${id}`).value, document.getElementById(`est-${id}`).value);
            alert('Guardado'); render();
        };

        window.del = (id) => {
            if(confirm('¿Eliminar esta orden?')) { APP.DAO.deleteOrder(id); render(); }
        };

        // --- FUNCIONALIDAD DEL MODAL ---
        
        window.verOrden = (id) => {
            const o = APP.DAO.getOrders().find(x => x.id === id);
            if(!o) return;

            const v = vehs.find(x => x.id == o.idVehiculo) || { modelo: '?', placas: '?', idCliente: 0 };
            const c = clients.find(x => x.id == v.idCliente) || { nombre: '?', telefono: '?' };

            const modalHtml = `
                <div class="detail-row"><span class="detail-label">Folio Orden:</span> <span>#${o.id}</span></div>
                <div class="detail-row"><span class="detail-label">Fecha Ingreso:</span> <span>${o.fecha}</span></div>
                <div class="detail-row"><span class="detail-label">Estado Actual:</span> <span>${o.idEstado}</span></div>
                <div class="detail-row"><span class="detail-label">Cliente:</span> <span>${c.nombre} (Tel: ${c.telefono})</span></div>
                <div class="detail-row"><span class="detail-label">Vehículo:</span> <span>${v.modelo} - ${v.placas} (${v.color || 'N/A'})</span></div>
                
                <div style="margin-top:15px; background:#f9f9f9; padding:10px; border-left:4px solid #e74c3c;">
                    <span class="detail-label">Falla Reportada (Recepción):</span><br>
                    <p style="margin:5px 0">${o.falla}</p>
                </div>

                <div style="margin-top:15px; background:#f9f9f9; padding:10px; border-left:4px solid #27ae60;">
                    <span class="detail-label">Bitácora Mecánico:</span><br>
                    <p style="margin:5px 0">${o.observacionesMecanico || 'Sin comentarios aún.'}</p>
                </div>
            `;

            document.getElementById('modalBody').innerHTML = modalHtml;
            document.getElementById('modalDetalle').style.display = "block";
        };

        window.cerrarModal = () => {
            document.getElementById('modalDetalle').style.display = "none";
        };
        
        // Cerrar si dan click afuera del modal
        window.onclick = function(event) {
            const modal = document.getElementById('modalDetalle');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        render();
    </script>
</body>
</html>
