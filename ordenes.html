<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Órdenes</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content">
        <h2>Órdenes de Trabajo</h2>
        
        <div class="card" id="panelCreate">
            <h3><span style="color:var(--accent)">+</span> Nueva Orden (Recepción)</h3>
            <form id="formOrd">
                <div class="form-group">
                    <label>Seleccionar Vehículo</label>
                    <select id="selCli" required><option value="">Buscar...</option></select>
                </div>
                <div class="form-group">
                    <label>Falla Reportada / Motivo Ingreso</label>
                    <textarea id="falla" rows="3" required></textarea>
                </div>
                <button class="btn btn-primary">Generar Orden</button>
            </form>
        </div>

        <div class="card">
            <h3>Tablero de Control</h3>
            <table>
                <thead><tr><th>ID</th><th>Vehículo</th><th>Diagnóstico (Recepción)</th><th>Bitácora Mecánico</th><th>Estado</th><th>Acción</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        APP.checkAuth();
        const user = APP.getSession();
        
        if(user.rol === 3) document.getElementById('panelCreate').style.display = 'none';

        // Cargar selects
        const vehs = APP.DAO.getVehicles();
        const sel = document.getElementById('selCli');
        vehs.forEach(v => sel.innerHTML += `<option value="${v.id}">${v.modelo} - ${v.placas}</option>`);

        function render() {
            const ords = APP.DAO.getOrders();
            const tbody = document.getElementById('tbody');
            tbody.innerHTML = '';
            
            ords.forEach(o => {
                const v = vehs.find(x => x.id == o.idVehiculo) || { modelo: '?', placas: '?' };
                
                // Lógica Visual según Rol
                let bitacora = o.observacionesMecanico || '<em style="color:#999">Sin registros</em>';
                let estadoBadge = `<span class="badge ${o.idEstado==='Terminado'?'bg-done':'bg-pending'}">${o.idEstado}</span>`;
                let accion = '';

                if(user.rol === 3) { // VISTA MECÁNICO
                    bitacora = `<textarea id="txt-${o.id}" placeholder="Describir trabajo...">${o.observacionesMecanico || ''}</textarea>`;
                    estadoBadge = `<select id="est-${o.id}">
                        <option ${o.idEstado=='Pendiente'?'selected':''}>Pendiente</option>
                        <option ${o.idEstado=='En Proceso'?'selected':''}>En Proceso</option>
                        <option ${o.idEstado=='Terminado'?'selected':''}>Terminado</option>
                    </select>`;
                    accion = `<button onclick="save(${o.id})" class="btn btn-success btn-sm">Guardar</button>`;
                } else if (user.rol === 1) { // VISTA ADMIN
                    accion = `<button onclick="del(${o.id})" class="btn btn-danger btn-sm">Eliminar</button>`;
                }

                tbody.innerHTML += `<tr>
                    <td>#${o.id}</td>
                    <td><b>${v.modelo}</b><br><small>${v.placas}</small></td>
                    <td>${o.falla}</td>
                    <td>${bitacora}</td>
                    <td>${estadoBadge}</td>
                    <td>${accion}</td>
                </tr>`;
            });
        }

        document.getElementById('formOrd').onsubmit = (e) => {
            e.preventDefault();
            APP.DAO.createOrder({
                idVehiculo: document.getElementById('selCli').value,
                falla: document.getElementById('falla').value
            });
            render(); e.target.reset();
        };

        window.save = (id) => {
            APP.DAO.updateOrderMechanic(
                id, 
                document.getElementById(`txt-${id}`).value,
                document.getElementById(`est-${id}`).value
            );
            alert('Avance registrado correctamente'); render();
        };

        window.del = (id) => {
            if(confirm('¿Eliminar esta orden?')) { APP.DAO.deleteOrder(id); render(); }
        };
        
        render();
    </script>
</body>
</html>
