<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ordenes</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content">
        <h2>Gestión de Órdenes (Recepción y Taller)</h2>
        
        <div class="card" id="panelCreate">
            <h3><span style="color:var(--accent)">+</span> Nueva Orden de Trabajo</h3>
            <form id="formOrd">
                <div class="form-row">
                    <div class="form-col">
                        <label>Vehículo</label>
                        <select id="selCli" required><option value="">Buscar...</option></select>
                    </div>
                    <div class="form-col">
                        <label>Kilometraje</label>
                        <input type="number" id="km" placeholder="Ej. 50000" required>
                    </div>
                    <div class="form-col">
                        <label>Nivel Gasolina</label>
                        <select id="gas" required>
                            <option>Reserva</option><option>1/4</option><option>1/2</option><option>3/4</option><option>Lleno</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-col">
                        <label>Falla Reportada (Cliente)</label>
                        <textarea id="falla" rows="2" required></textarea>
                    </div>
                    <div class="form-col">
                        <label>Observaciones Exteriores (Daños)</label>
                        <textarea id="obsExt" rows="2" placeholder="Rayones, golpes..."></textarea>
                    </div>
                </div>
                <button class="btn btn-primary" style="margin-top:10px">Generar Orden</button>
            </form>
        </div>

        <div class="card">
            <h3>Tablero de Control</h3>
            <table>
                <thead><tr><th>ID</th><th>Vehículo</th><th>Falla / Recepción</th><th>Bitácora Taller</th><th>Estado</th><th>Acción</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
    
    <div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);">
        <div style="background:#fff; margin:10% auto; padding:20px; width:50%; border-radius:5px;">
            <h3 id="mTit">Detalle</h3>
            <div id="mBod"></div>
            <button class="btn btn-primary" onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:10px;">Cerrar</button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        APP.checkAuth();
        const user = APP.getSession();
        if(user.rol === 3) document.getElementById('panelCreate').style.display = 'none';

        const vehs = APP.DAO.getVehicles();
        const sel = document.getElementById('selCli');
        vehs.forEach(v => sel.innerHTML += `<option value="${v.id}">${v.modelo} - ${v.placas}</option>`);

        function render() {
            const tbody = document.getElementById('tbody');
            tbody.innerHTML = '';
            const ords = APP.DAO.getOrdersFull(); // Usa la nueva función JOIN
            
            ords.forEach(o => {
                const v = vehs.find(x => x.id == o.idVehiculo) || {modelo:'?', placas:'?'};
                
                let bitacoraUI = o.bitacora || '<em>Sin registros</em>';
                let statusUI = `<span class="badge ${o.idEstado=='Terminado'?'bg-done':'bg-pending'}">${o.idEstado}</span>`;
                let actionUI = `<button onclick="ver(${o.id})" class="btn btn-primary btn-sm">Ver</button>`;

                if(user.rol === 3) { // Mecánico
                    bitacoraUI = `<textarea id="txt-${o.id}">${o.bitacora || ''}</textarea>`;
                    statusUI = `<select id="est-${o.id}">
                        <option ${o.idEstado=='Pendiente'?'selected':''}>Pendiente</option>
                        <option ${o.idEstado=='En Proceso'?'selected':''}>En Proceso</option>
                        <option ${o.idEstado=='Terminado'?'selected':''}>Terminado</option>
                    </select>`;
                    actionUI = `<button onclick="save(${o.id})" class="btn btn-success btn-sm">Guardar</button>`;
                } else if(user.rol === 1) { // Admin
                    actionUI += ` <button onclick="del(${o.id})" class="btn btn-danger btn-sm">Eliminar</button>`;
                }

                tbody.innerHTML += `<tr>
                    <td>#${String(o.id).padStart(4,'0')}</td>
                    <td><b>${v.modelo}</b><br>${v.placas}</td>
                    <td>${o.falla}<br><small>Km: ${o.km} | Gas: ${o.gas}</small></td>
                    <td>${bitacoraUI}</td>
                    <td>${statusUI}</td>
                    <td>${actionUI}</td>
                </tr>`;
            });
        }

        document.getElementById('formOrd').onsubmit = (e) => {
            e.preventDefault();
            APP.DAO.createOrder({
                idVehiculo: document.getElementById('selCli').value,
                km: document.getElementById('km').value,
                gas: document.getElementById('gas').value,
                falla: document.getElementById('falla').value,
                obsExt: document.getElementById('obsExt').value
            });
            e.target.reset(); render();
        };

        window.save = (id) => {
            APP.DAO.updateOrderMechanic(id, document.getElementById(`txt-${id}`).value, document.getElementById(`est-${id}`).value);
            alert('Bitácora actualizada'); render();
        };
        window.del = (id) => { if(confirm('¿Eliminar?')) { APP.DAO.deleteOrder(id); render(); } };
        
        window.ver = (id) => {
            const o = APP.DAO.getOrdersFull().find(x => x.id === id);
            const v = vehs.find(x => x.id == o.idVehiculo);
            document.getElementById('mBod').innerHTML = `
                <p><b>Vehículo:</b> ${v.modelo} (${v.placas})</p>
                <p><b>Falla:</b> ${o.falla}</p>
                <p><b>Datos Recepción:</b> ${o.km} Km, Gasolina ${o.gas}</p>
                <hr>
                <p><b>Bitácora Taller:</b> ${o.bitacora || 'Ninguna'}</p>
                <p><b>Estado:</b> ${o.idEstado}</p>
            `;
            document.getElementById('modal').style.display = 'block';
        };

        render();
    </script>
</body>
</html>
