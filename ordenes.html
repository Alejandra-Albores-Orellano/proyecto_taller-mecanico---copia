<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Órdenes</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content">
        <h2>Órdenes de Trabajo</h2>
        
        <div class="card" id="createCard">
            <h3>Crear Orden</h3>
            <form id="formOrder">
                <select id="clientSel" required><option value="">Seleccione Cliente...</option></select>
                <textarea id="falla" placeholder="Descripción de la falla (Recepción)" required></textarea>
                <button type="submit" class="btn btn-primary">Generar Orden</button>
            </form>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Cliente / Vehículo</th>
                        <th>Falla (Recepción)</th>
                        <th>Trabajo Realizado (Mecánico)</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        APP.checkAuth();
        const user = APP.getSession();

        if(user.role === 'mecanico') document.getElementById('createCard').style.display = 'none';

        // Cargar Select
        const clients = APP.DAO.getClients();
        const sel = document.getElementById('clientSel');
        clients.forEach(c => sel.innerHTML += `<option value="${c.id}">${c.nombre} - ${c.vehiculo}</option>`);

        function render() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            APP.DAO.getOrders().forEach(o => {
                const client = clients.find(c => c.id == o.clientId) || { nombre: 'Desconocido', vehiculo: '?' };
                
                // VISTA MECÁNICO
                let workHtml = o.workNotes || '---';
                let statusHtml = `<span class="badge bg-warn">${o.status}</span>`;
                let actionHtml = '';

                if(user.role === 'mecanico') {
                    workHtml = `<textarea id="note-${o.id}">${o.workNotes}</textarea>`;
                    statusHtml = `
                        <select id="stat-${o.id}">
                            <option ${o.status==='Pendiente'?'selected':''}>Pendiente</option>
                            <option ${o.status==='En Proceso'?'selected':''}>En Proceso</option>
                            <option ${o.status==='Terminado'?'selected':''}>Terminado</option>
                        </select>`;
                    actionHtml = `<button onclick="saveWork(${o.id})" class="btn btn-success">💾 Guardar</button>`;
                } else if(user.role === 'admin') {
                    actionHtml = `<button onclick="del(${o.id})" class="btn btn-danger">X</button>`;
                }

                tbody.innerHTML += `
                    <tr>
                        <td><strong>${client.vehiculo}</strong><br>${client.nombre}</td>
                        <td>${o.falla}</td>
                        <td>${workHtml}</td>
                        <td>${statusHtml}</td>
                        <td>${actionHtml}</td>
                    </tr>
                `;
            });
        }

        document.getElementById('formOrder').addEventListener('submit', (e) => {
            e.preventDefault();
            APP.DAO.createOrder({
                clientId: document.getElementById('clientSel').value,
                falla: document.getElementById('falla').value
            });
            e.target.reset(); render();
        });

        window.saveWork = (id) => {
            const notes = document.getElementById(`note-${id}`).value;
            const status = document.getElementById(`stat-${id}`).value;
            APP.DAO.updateOrder(id, { workNotes: notes, status: status });
            alert('Avance guardado'); render();
        };

        window.del = (id) => { if(confirm('Borrar orden?')) { APP.DAO.deleteOrder(id); render(); } };
        render();
    </script>
</body>
</html>
